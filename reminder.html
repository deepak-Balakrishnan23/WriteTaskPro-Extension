<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasve — Reminder</title>
  <style>
    /* The window itself is only a stage for the overlay: no chrome of its
       own, and a backdrop matching the overlay's scrim so there is no white
       flash between the window opening and the scene fading in. */
    html, body {
      margin: 0;
      height: 100%;
      background: #14142b;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script type="module" src="reminder-window.js"></script>
</body>
</html>
